[package]
name = "mcp-customer-service"
version = "2.2.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Customer Service MCP Server — conversations, customer intelligence, resolution, routing, satisfaction, and churn prediction for AI agents"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-customer-service"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "customer-service", "support", "csat", "helpdesk"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = { version = "0.2.0", git = "https://github.com/zavora-ai/adk-mcp-sdk.git", rev = "4dac4301441a8a51a042fd66cc1798f0ec3e3f55" }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
urlencoding = "2"
base64 = "0.22"
async-trait = "0.1"

[workspace]
